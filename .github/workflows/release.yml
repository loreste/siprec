name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# Serialize retries of the same release; never interrupt artifact publication.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate version and release state
      run: |
        VERSION=${TAG_NAME#v}
        test "$(cat VERSION)" = "$VERSION" || { echo "Tag and VERSION file disagree"; exit 1; }
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > release-state.json
        python3 - "$TAG_NAME" <<'PYCODE'
        import json, sys
        with open("release-state.json") as stream:
            releases = [release for page in json.load(stream) for release in page]
        if any(r["tag_name"] == sys.argv[1] and not r["draft"] for r in releases):
            sys.exit("Published releases cannot be rebuilt; use a new tag")
        PYCODE

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev pkg-config

    - name: Run tests
      run: |
        python3 -B scripts/test_release_tools.py
        go test -race -short ./pkg/... ./cmd/...

    - name: Build portable binaries
      run: |
        VERSION=${TAG_NAME#v}
        COMMIT=$(git rev-parse HEAD)
        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        LDFLAGS="-s -w -X siprec-server/pkg/version.Version=${VERSION} -X siprec-server/pkg/version.Commit=${COMMIT} -X siprec-server/pkg/version.BuildTime=${BUILD_TIME}"
        mkdir -p dist
        cp docs/release-artifacts.md dist/BUILD-NOTES.md
        for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          GOOS=${TARGET%/*}
          GOARCH=${TARGET#*/}
          BINARY="siprec-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then BINARY="${BINARY}.exe"; fi
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o "dist/$BINARY" ./cmd/siprec
          if [ "$TARGET" = linux/amd64 ]; then
            "./dist/$BINARY" --version > dist/build-info.json
            python3 scripts/verify-build-info.py dist/build-info.json "$VERSION" "$COMMIT" false
            rm dist/build-info.json
          fi
          if [ "$GOOS" = windows ]; then
            (cd dist && zip "siprec-${GOOS}-${GOARCH}.zip" "$BINARY" BUILD-NOTES.md)
          else
            tar -czf "dist/siprec-${GOOS}-${GOARCH}.tar.gz" -C dist "$BINARY" BUILD-NOTES.md
          fi
          rm "dist/$BINARY"
        done

    - name: Package Helm chart
      run: |
        VERSION=${TAG_NAME#v}
        helm lint deploy/helm/siprec-server
        helm package deploy/helm/siprec-server --version "$VERSION" --app-version "$VERSION" -d dist/

    - name: Generate checksums and release notes
      run: |
        (cd dist && sha256sum *.tar.gz *.zip *.tgz BUILD-NOTES.md > checksums.txt && sha256sum -c checksums.txt)
        python3 scripts/release-notes.py "${TAG_NAME#v}" > release-notes.md

    - name: Upload all assets to draft release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-notes.md
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/*.tgz
          dist/BUILD-NOTES.md
          dist/checksums.txt
        fail_on_unmatched_files: true
        draft: true
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  docker-release:
    name: Release Docker Image
    needs: release
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      if: ${{ env.DOCKERHUB_USERNAME != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compute image list
      id: images
      run: |
        {
          echo 'list<<EOF'
          echo "ghcr.io/${{ github.repository }}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "$DOCKERHUB_USERNAME/siprec-server"
          fi
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.images.outputs.list }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Set build timestamp
      id: build-info
      run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        target: production
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          VERSION=${{ github.ref_name }}
          COMMIT=${{ github.sha }}
          BUILD_TIME=${{ steps.build-info.outputs.time }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify published Docker image metadata
      env:
        IMAGE_REPO: ghcr.io/${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        docker run --rm --entrypoint /app/siprec "$IMAGE_REPO:${TAG_NAME#v}" --version > docker-build-info.json
        python3 scripts/verify-build-info.py docker-build-info.json "${TAG_NAME#v}" "$GITHUB_SHA" true

  publish:
    name: Verify and Publish Release
    needs: [release, docker-release]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout verification scripts
      uses: actions/checkout@v4

    - name: Verify uploaded draft artifacts
      run: |
        test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true
        gh release download "$TAG_NAME" --dir release-assets
        python3 scripts/verify-release-assets.py release-assets "${TAG_NAME#v}"

    # Publishing is the final step: immutable releases reject later asset uploads.
    - name: Publish immutable release
      run: gh release edit "$TAG_NAME" --draft=false
