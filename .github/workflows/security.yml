name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: |
        # Run govulncheck and filter out known unfixed upstream advisories.
        # GO-2026-4479 (pion/dtls) has no fix available yet.
        # Stdlib vulns require Go runtime upgrade, not code changes.
        govulncheck ./... 2>&1 | tee govulncheck.out || true
        # Fail only on non-stdlib, non-suppressed vulnerabilities
        if grep -q "^Vulnerability" govulncheck.out; then
          # Check for module (non-stdlib) vulns that aren't the known dtls issue
          if grep -A2 "^Vulnerability" govulncheck.out | grep "Module:" | grep -v "Standard library" | grep -v "GO-2026-4479"; then
            echo "::error::Unfixed module vulnerability detected"
            exit 1
          fi
        fi

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: go

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:go"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog Scan
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run gosec (blocking — high/medium severity)
      run: |
        # Excluded rules (all pre-existing, reviewed, and intentional):
        # G115: integer overflow false positives on type conversions
        # G201: SQL formatting in database layer (parameterized where possible)
        # G204: exec.Command for ffmpeg/whisper (paths validated before use)
        # G301/G306: dir/file perms for shared recordings and readable configs
        # G401/G501: MD5 required by RFC 2617 SIP digest authentication
        # G404: math/rand in mock/test/non-security code (audio VAD, AMQP jitter)
        gosec -exclude=G115,G201,G204,G301,G306,G401,G404,G501 \
          -severity=medium -confidence=medium -fmt=text ./...

    - name: Run gosec (SARIF upload — informational)
      if: always()
      run: |
        gosec -no-fail -exclude=G115 -fmt sarif -out gosec-results.sarif ./...

    - name: Fix SARIF format
      if: always()
      run: |
        # Fix invalid null relationships in SARIF output
        jq 'walk(if type == "object" and has("relationships") then
          .relationships = [.relationships[] | select(. != null)]
        else . end)' gosec-results.sarif > gosec-results-fixed.sarif
        mv gosec-results-fixed.sarif gosec-results.sarif

    - name: Upload SARIF file
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec-results.sarif
      continue-on-error: true
